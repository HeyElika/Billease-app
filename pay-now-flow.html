/* ══════════════════════════════════════════════════════════════════════════
   Billease tokens — copied verbatim from ~/Billease-app/src/index.css.
   No new tokens, colours or type styles were created.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme: light;
  --font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ds-font-family:'Source Sans 3','Source Sans Pro',-apple-system,BlinkMacSystemFont,sans-serif;

  --text-xs:11px; --text-sm:13px; --text-md:14px; --text-lg:16px;
  --text-xl:20px; --text-2xl:24px; --text-3xl:32px;

  --canvas-default:#F5F5F5; --canvas-alt:#FFFFFF;
  --bg-base:#FFFFFF; --bg-subtle:#F5F5F5; --bg-sunken:#E0E0E0;
  --bg-elevated:#D4D4D4; --bg-strong:#919191;
  --bg-primary:#E7161A; --bg-secondary:#265CE5; --bg-loans:#265CE5;
  --bg-selected:#BFD1FF; --bg-success-subtle:#EEF8F4; --bg-success-bold:#DAEEE6;
  --bg-info-subtle:#EDF7FF; --bg-warning-subtle:#FFF6DB;

  --text-base:#1A1A1A; --text-subtle:#545454; --text-disabled:#B0B0B0;
  --text-on-dark:#FFFFFF; --text-on-dark-subtle:#FFFFFFB3;
  --text-primary:#E7161A; --text-brand-primary:#E7161A; --text-secondary:#265CE5;
  --text-success:#037F4D; --text-info:#13456D;

  --border-subtle:#E0E0E0; --border-default:#D4D4D4; --border-strong:#919191;
  --border-bold:#919191; --border-on-dark:#FFFFFF; --border-primary:#E7161A;
  --border-info:#13456D;
  --border-width-100:1px; --border-width-200:2px; --border-width-300:3px;

  --icon-base:#1A1A1A; --icon-subtle:#545454; --icon-disabled:#B0B0B0;
  --icon-on-dark:#FFFFFF; --icon-primary:#E7161A;

  --space-050:2px; --space-100:4px; --space-200:8px; --space-300:12px;
  --space-400:16px; --space-500:20px; --space-600:24px; --space-700:28px;
  --space-800:32px; --space-900:40px; --space-1000:48px;

  --radius-xs:2px; --radius-sm:4px; --radius-md:8px; --radius-lg:12px;
  --radius-xl:16px; --radius-2xl:24px; --radius-full:9999px;

  --shadow-xs:0 8px 34px rgba(46,60,72,0.04);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.10);

  /* Deprecated Figma styles. The Loans list and Loan details frames in the
     Pay now file still use the pre-token palette (Figma marks these
     "depreciated/..."). Reproduced verbatim so those screens match the file.
     These are NOT new tokens and must not be used on new work. */
  --legacy-navy:#1D2D40;          /* Primary/Text Primary */
  --legacy-navy-70:rgba(29,45,64,0.7);
  --legacy-dark-blue:#294567;     /* depreciated/Text dark-blue */
  --legacy-primary-blue:#203AA9;  /* Primary/Primary blue */
  --legacy-light-blue-1:#9BA8E0;  /* Secondary/Light blue 1 */
  --legacy-light-blue-2:#EDF1FF;  /* Secondary/Light blue 2 */
  --legacy-border-blue:#DEE4FF;
  --legacy-border-blue-grey:#D4D7EC;
  --legacy-border-grey:#E0E5F0;   /* Secondary/Border grey */
  --legacy-green:#13BD85;         /* System response/Green */
  --legacy-card-shadow:0 5px 13px -2px rgba(56,83,150,0.21);
  --legacy-row-shadow:0 5px 6.5px rgba(56,83,150,0.21);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--canvas-default); color:var(--text-base);
  font-family:var(--font-family); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; }
[hidden]{ display:none !important; }

/* ══ Page ═════════════════════════════════════════════════════════════ */
.wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center;

/* ══ Screen transition — "StepForwardBack", Figma Motion file
      P4kziTuTniQFQen8RQUIuy node 543:13181 ════════════════════════════ */
.stage{ position:relative; flex:1; min-height:0; overflow:hidden; background:#fff; }
.layer{ position:absolute; inset:0; display:flex; flex-direction:column;
  background:#fff; overflow:hidden; }
.layer.over{ z-index:2; }
.dimlayer{ position:absolute; inset:0; background:#000; opacity:0; z-index:1; pointer-events:none; }
@keyframes slideInRight{ from{ transform:translateX(100%) } to{ transform:translateX(0) } }
@keyframes slideOutRight{ from{ transform:translateX(0) } to{ transform:translateX(100%) } }
@keyframes pushLeft{ from{ transform:translateX(0) } to{ transform:translateX(-40px) } }
@keyframes dimIn{ from{ opacity:0 } to{ opacity:.3 } }
@keyframes dimOut{ from{ opacity:.3 } to{ opacity:0 } }
.anim-in{ animation:slideInRight 320ms cubic-bezier(.4,0,.2,1) both; }
.anim-out{ animation:slideOutRight 320ms cubic-bezier(.4,0,.2,1) both; }
.anim-push{ animation:pushLeft 320ms cubic-bezier(.4,0,.2,1) both; }
.anim-dimin{ animation:dimIn 320ms ease both; }
.anim-dimout{ animation:dimOut 320ms ease both; }
@media (prefers-reduced-motion:reduce){
  .anim-in,.anim-out,.anim-push,.anim-dimin,.anim-dimout{ animation-duration:1ms; }
}

/* ══ Shared in-screen chrome — Source Sans Pro everywhere ═══════════════ */
.scr{ display:flex; flex-direction:column; flex:1; min-height:0;

.scroll{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; }

.progress .track{ height:8px; border-radius:var(--radius-sm);
  background:var(--legacy-border-blue); overflow:hidden; }
.progress .track i{ display:block; height:100%; width:21.34%;
  background:var(--legacy-green); border-radius:var(--radius-sm); }
.progress .cap{ margin:var(--space-100) 0 0; font-size:var(--text-lg); color:var(--legacy-navy); }
.progress .cap b{ font-weight:700; }
.progress .cap i{ font-style:normal; font-weight:600; color:var(--legacy-navy-70); }
.payrow{ background:#fff; border-radius:var(--radius-lg); box-shadow:var(--legacy-card-shadow);
  height:52px; display:flex; align-items:center; gap:var(--space-300); padding:0 var(--space-400); }
.payrow .d{ font-size:var(--text-lg); color:var(--legacy-navy); margin:0; width:104px; flex-shrink:0; }
.payrow .a{ font-size:var(--text-lg); font-weight:600; color:var(--legacy-dark-blue); margin:0; flex:1 0 0; }
.payrow .p{ font-size:var(--text-lg); color:var(--legacy-navy-70); margin:0; }
.payrow img{ width:20px; height:20px; }
.detcta{ flex-shrink:0; background:var(--bg-base); padding:var(--space-200) var(--space-400) var(--space-400);
  display:flex; justify-content:center; }
.detcta button{ width:260px; height:40px; border:0; cursor:pointer;
  background:var(--bg-primary); color:var(--text-on-dark); border-radius:var(--radius-full);
  font-family:var(--ds-font-family); font-size:var(--text-lg); font-weight:600;
  letter-spacing:.5px; }

/* ══ Screen: Select payment amount — Figma 62276:9022 ══════════════════ */
.scrbody{ padding:var(--space-600) var(--space-500); display:flex;
  flex-direction:column; gap:var(--space-600); background:var(--canvas-alt); }
.sectitle{ display:flex; align-items:center; gap:var(--space-200); height:24px; width:100%; }
.sectitle p{ margin:0; font-size:var(--text-lg); font-weight:600; line-height:1.5; color:var(--text-base); }
.group{ display:flex; flex-direction:column; gap:var(--space-300); width:100%; }
.card{ background:var(--bg-base); border:var(--border-width-100) solid var(--border-subtle);
  border-radius:var(--radius-lg); width:100%; display:flex; flex-direction:column; text-align:left; }
.card.collapsed{ padding:var(--space-300) var(--space-400); }
.card.expanded{ padding:var(--space-300) var(--space-400) 0; gap:var(--space-400); }
.card.is-primary{ box-shadow:var(--shadow-xs); }
.cardtoggle{ background:none; border:0; padding:0; margin:0; cursor:pointer;
  display:flex; flex-direction:column; align-items:stretch; gap:var(--space-200);
  width:100%; text-align:left; font-family:inherit; }
.cardtoggle:focus-visible{ outline:2px solid var(--border-info); outline-offset:3px;
  border-radius:var(--radius-sm); }
.headrow{ display:flex; align-items:center; gap:var(--space-200); width:100%; }
.headrow .left{ flex:1 0 0; min-width:0; display:flex; flex-direction:column; gap:var(--space-050); }
.headrow .name{ margin:0; font-size:var(--text-lg); font-weight:600; line-height:1.5;
  color:var(--text-base); word-break:break-word; }
.headrow .name.sm{ font-size:var(--text-md); }
.headrow .idrow{ display:flex; align-items:center; gap:var(--space-100); }
.headrow .idrow span{ font-size:var(--text-md); font-weight:400; line-height:1.5;
  color:var(--text-subtle); white-space:nowrap; }
.headrow .right{ display:flex; align-items:center; justify-content:flex-end;
  gap:var(--space-300); flex-shrink:0; }
.headrow .amt{ margin:0; font-size:var(--text-lg); font-weight:600; line-height:1.5;
  color:var(--text-base); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
.bottomline{ display:flex; align-items:center; gap:5px; width:100%; }
.bottomline .due{ flex:1 0 0; min-width:0; margin:0; font-size:var(--text-md);
  font-weight:400; line-height:1.5; color:var(--text-subtle); }
.bottomline .due.sm{ font-size:var(--text-sm); }
.bottomline .tag{ margin:0; font-size:var(--text-md); font-weight:400; line-height:1.5;
  color:var(--text-subtle); text-align:right; white-space:nowrap; }
.optlist{ border-top:var(--border-width-100) solid var(--border-subtle);
  padding:var(--space-200) 0; width:100%; display:flex; flex-direction:column; }
.opt{ display:flex; align-items:center; gap:var(--space-500); padding:var(--space-300) 0;
  width:100%; background:none; border:0; cursor:pointer; text-align:left; font-family:inherit; }
.opt.multiline{ align-items:flex-start; gap:var(--space-400); }
.opt:focus-visible{ outline:2px solid var(--border-info); outline-offset:2px; border-radius:var(--radius-sm); }
.opt .l{ flex:1 0 0; min-width:0; display:flex; align-items:center; gap:var(--space-200); }
.opt.multiline .l{ align-items:flex-start; }
.opt .txt{ flex:1 0 0; min-width:0; display:flex; flex-direction:column; }
.opt .lab{ margin:0; font-size:var(--text-lg); font-weight:400; line-height:1.5; color:var(--text-base); }
.opt .sub{ margin:0; font-size:var(--text-md); font-weight:400; line-height:1.5; color:var(--text-subtle); }
.opt .val{ margin:0; font-size:var(--text-lg); font-weight:600; line-height:1.5;
  color:var(--text-base); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
.radio{ width:20px; height:20px; flex-shrink:0; display:block; }

/* checkbox — Figma 188:2520 (default) / 188:2523 (checked), the control inside
   checkbox-paragraph 183:2213. 24px box, 2px --border-bold ring, --radius-md,
   --bg-primary fill with the tick glyph when checked. */
.cbox{ width:24px; height:24px; flex-shrink:0; border-radius:var(--radius-md);
  border:var(--border-width-200) solid var(--border-bold);
  display:flex; align-items:center; justify-content:center; }
.cbox.on{ border-color:transparent; background:var(--bg-primary); }
.skiprow{ display:flex; align-items:flex-start; gap:var(--space-200); width:100%;
  background:none; border:0; padding:var(--space-100) 0 0; cursor:pointer;
  text-align:left; font-family:inherit; }
.skiprow:focus-visible{ outline:2px solid var(--border-info); outline-offset:2px;
  border-radius:var(--radius-sm); }
.skiprow .txt{ flex:1 0 0; min-width:0; display:flex; flex-direction:column; }
.skiprow .lab{ font-size:var(--text-lg); font-weight:400; line-height:1.5; color:var(--text-base); }
.skiprow .sub{ font-size:var(--text-md); font-weight:400; line-height:1.5; color:var(--text-subtle); }


/* action-bar — Figma 62276:9033, specs from ActionBar.jsx */
.actionbar{ position:relative; flex-shrink:0; background:var(--bg-base);
  padding:var(--space-300) var(--space-500) var(--space-500);
  display:flex; flex-direction:column; gap:var(--space-300); }
/* Same rule as the NavHeader border: only shown while content is still
   hidden behind the bar, never on a page that fits. */
.actionbar .brd{ position:absolute; top:0; left:0; right:0; height:1px;
  background:var(--border-subtle); opacity:0; transition:opacity .15s ease; }
.actionbar.scrolled .brd{ opacity:1; }
.btn{ height:48px; width:100%; border:0; cursor:pointer; background:var(--bg-primary);
  color:var(--text-on-dark); border-radius:var(--radius-full);
  display:flex; align-items:center; justify-content:center; gap:var(--space-200);
  padding:0 var(--space-500); font-family:var(--ds-font-family);
  font-size:var(--text-lg); font-weight:600; line-height:1.5; font-variant-numeric:tabular-nums; }
.btn:active{ box-shadow:inset 0 0 0 999px rgba(0,0,0,.30); }

/* ══ Screen: Pay with QRPh — Figma 62286:34271 ═════════════════════════ */
.qrbody{ padding:var(--space-600) var(--space-500); display:flex; flex-direction:column;

.ticket{ position:relative; width:296px; height:476px; flex-shrink:0; }

.ticket .qr .mark{ position:relative; width:60px; height:60px; background:var(--bg-base);
  display:flex; align-items:center; justify-content:center; padding:8px; }
.ticket .qr .mark img{ width:100%; height:100%; object-fit:contain; }
.ticket .dl{ height:40px; padding:0 var(--space-400); border:0; cursor:pointer;
  background:var(--bg-sunken); color:var(--text-base); border-radius:var(--radius-full);
  display:flex; align-items:center; justify-content:center; gap:var(--space-200);
  font-family:var(--ds-font-family); font-size:var(--text-lg); font-weight:600; }
.ticket .sep{ width:248px; height:3px; }
.ticket .subtotal{ flex:1 0 auto; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:var(--space-200); padding:var(--space-600) var(--space-400); width:100%; }
.ticket .subtotal .big{ margin:0; font-size:var(--text-3xl); font-weight:700;
  line-height:1.25; text-align:center; color:var(--text-base); font-variant-numeric:tabular-nums; }
.ticket .note{ background:var(--bg-info-subtle); padding:var(--space-300);
  border-radius:0 0 var(--radius-lg) var(--radius-lg); width:100%; }
.ticket .note p{ margin:0; font-size:var(--text-md); text-align:center; color:var(--text-base); }
.dslink{ background:none; border:0; padding:0; cursor:pointer;

   qESeTFW1GEEosrYnm4Hu3b). No SVG was authored by hand.
   Figma's "icon-placeholder" carries 2px padding, so a 16px box holds a 12px
   glyph, a 20px box holds a 16px glyph and a 24px box holds a 20px glyph.
   ══════════════════════════════════════════════════════════════════════════ */
function icon(name, glyph, color){
  var i = ICONS[name];
  if (!i) return '';
  var paths = i.paths.map(function(p){
    return '<path d="' + p.d + '" fill="' + color + '"'
      + (p.fillRule ? ' fill-rule="' + p.fillRule + '"' : '')
      + (p.clipRule ? ' clip-rule="' + p.clipRule + '"' : '') + '/>';
  }).join('');
  return '<svg width="' + glyph + '" height="' + glyph + '" viewBox="' + i.viewBox
    + '" fill="none" aria-hidden="true" focusable="false" style="display:block">' + paths + '</svg>';
}
function iconBox(name, box, glyph, color){
  return '<span style="width:' + box + 'px;height:' + box + 'px;flex-shrink:0;display:flex;'
    + 'align-items:center;justify-content:center">' + icon(name, glyph, color) + '</span>';
}

    ? '<div class="idrow"><span>' + d.ref + '</span>' + iconBox('copy',16,12,'var(--icon-subtle)') + '</div>' : '';
  var headAmt = (open && o && o.amt) ? '<p class="amt">' + fmt(o.amt) + '</p>' : '';
  /* "Next installment" exists in Figma only on the next-installment state. */
  var tag = (open && d.nextKey && sel === d.nextKey) ? '<p class="tag">Next installment</p>' : '';

  var head = '<button class="cardtoggle" type="button" data-toggle="' + key + '" aria-expanded="' + open + '">'
    + '<div class="headrow"><div class="left"><p class="' + nameCls + '">' + d.name + '</p>' + idRow + '</div>'
    + '<div class="right">' + headAmt + iconBox(open ? 'chevron-up' : 'chevron-down',16,12,'var(--icon-base)') + '</div></div>'
    + '<div class="bottomline">' + iconBox('calendar-outline',16,12,'var(--icon-subtle)')
    + '<p class="' + dueCls + '">' + d.due + '</p>' + tag + '</div></button>';

  /* The master "Don't include other payments" checkbox replaces the per-card
     skip on the optional items, so only the primary loan keeps its own. */
  var list = isPrimary ? d.options : d.options.filter(function(op){ return op.k !== 'none'; });

  var opts = '';
  if (open) {
    opts = '<div class="optlist">' + list.map(function(op){
      var on = sel === op.k;
      var txt = '<span class="txt"><span class="lab">' + op.label + '</span>'
        + (op.sub ? '<span class="sub">' + op.sub + '</span>' : '') + '</span>';
      return '<button class="opt' + (op.sub ? ' multiline' : '') + '" type="button"'
        + ' data-pick="' + key + '" data-opt="' + op.k + '" aria-pressed="' + on + '">'
        + '<span class="l">' + radio(on) + txt + '</span>'
        + (op.amt != null ? '<span class="val">' + fmt(op.amt) + '</span>' : '') + '</button>';
    }).join('') + '</div>';
  }
  return '<div class="card ' + (open ? 'expanded' : 'collapsed')
    + (isPrimary ? ' is-primary' : '') + '">' + head + opts + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   Prototype: one phone, five screens, StepForwardBack transitions
   (Figma Motion file P4kziTuTniQFQen8RQUIuy, node 543:13181).
   ══════════════════════════════════════════════════════════════════════════ */
var FLOW = [
  { key:'home',   label:'Home' },
  { key:'loans',  label:'Loans list' },
  { key:'detail', label:'Loan details' },
  { key:'paynow', label:'Pay now' },
  { key:'qrph',   label:'Pay with QRPh' }
];
var proto = { screen:'home', painted:null, st:freshState(), busy:false };

function screenHTML(key){
  if (key === 'home')   return screenHome();
  if (key === 'loans')  return screenLoans();
  if (key === 'detail') return screenDetail();
  if (key === 'paynow') return screenPayNow(proto.st, 'detail');
  return screenQR(proto.st);
}

var host = document.getElementById('protohost');
host.innerHTML =
  '<div class="phone lg"><div class="sides"><i class="pw"></i><i class="v1"></i><i class="v2"></i></div>'
  + '<div class="body"><div class="cam"></div><div class="screen">'
  + '<div class="stage"><div class="layer base"></div><div class="dimlayer"></div>'
  + '<div class="layer over" hidden></div></div>' + NAVBAR
  + '</div></div></div>';

var stage = host.querySelector('.stage');
var base  = host.querySelector('.layer.base');
var dim   = host.querySelector('.dimlayer');
var over  = host.querySelector('.layer.over');
function wireScroll(root){
  var sc = root.querySelector('.scroll');
  if (!sc) return;
  var hd = root.querySelector('.navhdr');
  var ab = root.querySelector('.actionbar');
  /* Both dividers are driven by scroll, never hardcoded: the header border
     once content has scrolled under it, the action bar border while content
     is still hidden behind it. */
  function sync(){
    if (hd) hd.classList.toggle('scrolled', sc.scrollTop > 0);
    if (ab) ab.classList.toggle('scrolled',
      sc.scrollHeight - sc.clientHeight - sc.scrollTop > 1);
  }
  sc.addEventListener('scroll', sync);
  sync();
}
function paint(){
  /* Re-rendering in place (expanding a card, changing a selection) keeps the
     scroll position; moving to another screen starts at the top. */
  var prev = base.querySelector('.scroll');
  var keep = (proto.painted === proto.screen && prev) ? prev.scrollTop : 0;
  base.innerHTML = screenHTML(proto.screen);
  base.style.transform = '';
  var sc = base.querySelector('.scroll');
  if (sc) sc.scrollTop = keep;
  proto.painted = proto.screen;
  wireScroll(base);
}
function nav(to, dir){
  if (proto.busy || !to || to === proto.screen) return;
  proto.busy = true;
  var from = proto.screen;
  over.hidden = false;
  if (dir === 'back') {
    base.innerHTML = screenHTML(to);
    over.innerHTML = screenHTML(from);
    over.className = 'layer over anim-out';
    dim.className  = 'dimlayer anim-dimout';
  } else {
    base.innerHTML = screenHTML(from);
    over.innerHTML = screenHTML(to);
    base.className = 'layer base anim-push';
    over.className = 'layer over anim-in';
    dim.className  = 'dimlayer anim-dimin';
  }
  setTimeout(function(){
    base.className = 'layer base';
    over.className = 'layer over';
    dim.className  = 'dimlayer';
    over.hidden = true; over.innerHTML = '';
    proto.screen = to;
    paint();
    proto.busy = false;
  }, 330);
}

stage.addEventListener('click', function(e){
  var navEl = e.target.closest('[data-nav]');
  if (navEl) { nav(navEl.getAttribute('data-nav'), navEl.getAttribute('data-dir')); return; }
  var sk = e.target.closest('[data-skip]');
  if (sk) {
    proto.st.skip = !proto.st.skip;
    /* Opting out clears and closes the optional items so the total falls back
       to the loan the user arrived with. */
    if (proto.st.skip) {
      EXTRAS.forEach(function(x){ proto.st.sel[x] = null; proto.st.exp[x] = false; });
    }
    paint();
    return;
  }
  var tg = e.target.closest('[data-toggle]');
  if (tg) { var k = tg.getAttribute('data-toggle'); proto.st.exp[k] = !proto.st.exp[k]; paint(); return; }
  var pk = e.target.closest('[data-pick]');
  if (pk) {
    var key = pk.getAttribute('data-pick'), opt = pk.getAttribute('data-opt');
    /* Tapping the active row again clears it, so an add-on can be dropped
       without hunting for "Don't include". */
    proto.st.sel[key] = (proto.st.sel[key] === opt) ? null : opt;
    paint();
  }
});
paint();
</script>
